services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: flink-poc-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - flink-poc

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: flink-poc-minio
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    volumes:
      - minio_data:/data
    networks:
      flink-poc:
        aliases:
          - warehouse.minio

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: flink-poc-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin password; do sleep 2; done;
      mc mb -p local/warehouse || true;
      mc anonymous set download local/warehouse || true;
      echo 'MinIO warehouse bucket ready';
      "
    networks:
      - flink-poc

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: flink-poc-iceberg-rest
    ports:
      - "18181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CLIENT__REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - flink-poc

  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: apache-flink-poc:1.18.1
    container_name: flink-poc-jobmanager
    command: jobmanager
    ports:
      - "18081:8081"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: earthquakes
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      S3_ENDPOINT: http://minio:9000
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        execution.checkpointing.interval: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        classloader.parent-first-patterns.additional: org.apache.iceberg;com.codahale;io.dropwizard
    volumes:
      - ./src/flink:/opt/flink/usrlib
      - ./scripts/submit_job.sh:/opt/flink/usrlib/submit_job.sh:ro
      - flink_checkpoints:/tmp/flink-checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - flink-poc

  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: apache-flink-poc:1.18.1
    container_name: flink-poc-taskmanager
    command: taskmanager
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: earthquakes
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      S3_ENDPOINT: http://minio:9000
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        state.backend: hashmap
        execution.checkpointing.interval: 30000
        classloader.parent-first-patterns.additional: org.apache.iceberg;com.codahale;io.dropwizard
    volumes:
      - ./src/flink:/opt/flink/usrlib
      - flink_checkpoints:/tmp/flink-checkpoints
    depends_on:
      - flink-jobmanager
    networks:
      - flink-poc

  flink-job-submitter:
    build:
      context: .
      dockerfile: Dockerfile
    image: apache-flink-poc:1.18.1
    container_name: flink-poc-job-submitter
    entrypoint: ["/bin/bash", "/opt/flink/usrlib/submit_job.sh"]
    environment:
      FLINK_JOBMANAGER: flink-jobmanager:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: earthquakes
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CHECKPOINT_INTERVAL_MS: "30000"
    volumes:
      - ./src/flink:/opt/flink/usrlib
      - ./scripts/submit_job.sh:/opt/flink/usrlib/submit_job.sh:ro
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    networks:
      - flink-poc
    restart: "no"

  usgs-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    image: apache-flink-poc-producer:latest
    container_name: flink-poc-usgs-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: earthquakes
      USGS_POLL_SECONDS: "60"
      USGS_MIN_MAGNITUDE: "2.5"
      USGS_LOOKBACK_HOURS: "24"
      USGS_API_URL: https://earthquake.usgs.gov/fdsnws/event/1/query
    depends_on:
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
    networks:
      - flink-poc
    restart: unless-stopped

networks:
  flink-poc:
    driver: bridge

volumes:
  minio_data:
  flink_checkpoints:

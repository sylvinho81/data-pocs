services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: dbt_poc_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  clickhouse_data:
